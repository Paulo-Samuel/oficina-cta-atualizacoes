  - Só para ver: nenhum botão muda OS. Lê só a função public.patio_web_painel (supabase/patio_web.sql), que
    devolve placa, modelo, cliente (nome), mecânico, situação, etapa, datas e o relógio do mecânico -- nada de
    CPF/CNPJ nem valores.
  - O mesmo quadro do Pátio do programa no modo TV (feedback do Ronan, 04/11/2026): uma coluna por etapa, na ordem
    do programa (banco.ETAPAS_OS), com o contador; as etapas desmarcadas no programa somem (a não ser que tenham
    carro); a OS finalizada SAI do quadro e vai para a faixa "Entregues/finalizadas hoje"; o relógio do mecânico
    ("na bancada há 1h20") ao lado do tempo da OS ("aberta há 15 h"); letras A-/A+ de 50% a 150%.
  - Funciona com a função antiga (sem 'finalizadas_hoje', 'relogio' e 'etapas'): separa as finalizadas aqui, mostra
    só o tempo da OS e usa as colunas padrão.
  - Entra com o login da equipe (ou o e-mail da conta) e a senha, no Auth do Supabase. Na página vai só a chave
    PÚBLICA (anon); quem protege os dados é o RLS/oficina_da_sessao() no servidor. Nunca uma chave service_role.
  - Atualiza sozinha: a cada 5 s com a página visível (a resposta é minúscula quando nada mudou), 30 s escondida.
  - https://ysoiqefnkjtessyhwzug.supabase.co e sb_publishable_01273TSKNqVnSbDioqcJZA_yxmcH8lR são trocados na publicação (scripts/publicar_patio_web.py).

  let sessao = lerSessao();   // {access_token, refresh_token, expira, lembrar}
  const st = { seq: 0, dados: null, quadro: null, nomes: {}, ultimoOk: 0, ultimoCompleto: 0, desvio: 0, vistos: new Map(), timer: 0, rodando: false, erro: '' };

  function dataLocal(iso) {   // '2026-11-04T10:00' (hora local do PC, sem fuso), '2026-11-04' ou ISO com fuso/Z

  function montarQuadro(d) {
    const todas = Array.isArray(d && d.os) ? d.os.filter(o => o && typeof o === 'object') : [];
    const andamento = todas.filter(o => NO_PATIO.includes(o.status));
    // funcao nova: 'finalizadas_hoje' a parte; funcao antiga: as finalizadas vinham misturadas em 'os' -> saem do quadro aqui
    const finalizadas = (Array.isArray(d && d.finalizadas_hoje) ? d.finalizadas_hoje.filter(o => o && typeof o === 'object')

      .sort((a, b) => String(b.finalizada_em || '').localeCompare(String(a.finalizada_em || '')));   // a mais nova primeiro
    const config = Array.isArray(d && d.etapas) ? d.etapas.filter(e => ETAPAS.includes(e)) : [];
    const ativas = config.length ? config : ETAPAS_PADRAO;
    const porColuna = new Map(ETAPAS.map(e => [e, []]));
    for (const o of andamento) {
      const coluna = ETAPAS.includes(o.etapa) ? o.etapa : ETAPAS[0];   // sem etapa (ou uma que nao existe mais): Recepcao
      porColuna.get(coluna).push({ ...o, coluna });
    }
    for (const lista of porColuna.values()) {   // quem entrou primeiro (espera ha mais tempo) no topo
      lista.sort((a, b) => (entradaDe(a) ? 0 : 1) - (entradaDe(b) ? 0 : 1) || String(entradaDe(a)).localeCompare(String(entradaDe(b)))
        || (Number(a.numero) || 0) - (Number(b.numero) || 0));
    }
    // nomes que a oficina deu as etapas no programa (so o texto da tela; a funcao antiga do Supabase nao manda)
    const nomes = {};
    if (d && d.rotulos && typeof d.rotulos === 'object') for (const e of ETAPAS) if (typeof d.rotulos[e] === 'string' && d.rotulos[e].trim()) nomes[e] = d.rotulos[e].trim().slice(0, 40);
    // a ordem e a do programa; desmarcada no programa some, a nao ser que tenha carro (como o Patio do programa)
    const colunas = ETAPAS.filter(e => ativas.includes(e) || porColuna.get(e).length)
      .map(e => ({ etapa: e, rotulo: nomes[e] || e, cor: CORES[e] || 'neutro', quantidade: porColuna.get(e).length, os: porColuna.get(e) }));
    return { colunas, finalizadas, total: andamento.length, configurada: config.length > 0 };
  }
  // tempos como no Patio do programa (gestao.js: tempoPatio, duracaoPatio, textoBancada)
  const tempoPatio = m => m == null ? '' : m < 1 ? 'agora' : m < 60 ? `há ${m} min` : m < 1440 ? `há ${Math.floor(m / 60)} h`
    : `há ${Math.floor(m / 1440)} ${Math.floor(m / 1440) === 1 ? 'dia' : 'dias'}`;
  const duracaoPatio = m => m == null ? '' : m < 1 ? 'menos de 1 min' : m < 60 ? `${m} min`
    : m < 1440 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}` : `${Math.floor(m / 1440)} d ${Math.floor((m % 1440) / 60)} h`;
  const minutosDesde = (data, agoraMs) => data ? Math.max(0, Math.floor((agoraMs - data.getTime()) / 60000)) : null;
  function textosDoCarro(o, agoraMs) {
    const entrada = dataLocal(entradaDe(o));

    const r = o.relogio && typeof o.relogio === 'object' ? o.relogio : null;
    let bancada = '', estado = '', dica = '';
    if (r && r.inicio_em && dataLocal(r.inicio_em)) {
      const m = minutosDesde(dataLocal(r.inicio_em), agoraMs);
      bancada = m < 1 ? 'na bancada agora' : `na bancada há ${duracaoPatio(m)}`;
      estado = 'correndo';
      const total = m + Math.floor((Number(r.anteriores_s) || 0) / 60);
      dica = `Passada para ${r.mecanico || 'o mecânico'} às ${dataLocal(r.inicio_em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`
        + (total > m ? ` · total dele nesta OS: ${duracaoPatio(total)}` : '');
    } else if (r && r.terminou_em && dataLocal(r.terminou_em)) {
      bancada = `terminou há ${duracaoPatio(minutosDesde(dataLocal(r.terminou_em), agoraMs))} · ${duracaoPatio(Math.floor((Number(r.mecanico_s) || 0) / 60))} de bancada`;
      estado = 'terminou';
      dica = 'O mecânico terminou: falta o chefe de oficina finalizar';
    }
    return { aberta: min == null ? '' : `aberta ${tempoPatio(min)}`, muito: min != null && min >= 3 * 1440, bancada, estado, dica };
  }
  // ==== fim do quadro ====

  // ---------- tema, tela cheia, letras ----------
  const TEMAS = ['escuro', 'claro', 'auto'];
  function aplicarTema(t) { document.documentElement.dataset.tema = t; $('#tema').textContent = `Tema: ${t}`; }
  let tema = pref('gotech-patio-tema', 'escuro');   // a TV: escuro, como o modo TV do programa
  if (!TEMAS.includes(tema)) tema = 'escuro';
  aplicarTema(tema);
  $('#tema').addEventListener('click', () => { tema = TEMAS[(TEMAS.indexOf(tema) + 1) % TEMAS.length]; gravarPref('gotech-patio-tema', tema); aplicarTema(tema); });
  $('#tela-cheia').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {});
  });
  let trava = null;  // a TV nao apaga a tela (onde o navegador deixa)
  async function manterAcesa() { try { if ('wakeLock' in navigator && !document.hidden) trava = await navigator.wakeLock.request('screen'); } catch (e) { trava = null; } }
  // tamanho das letras (como o A-/A+ do modo TV do programa): 30% a 150%, de 10 em 10, lembrado neste navegador
  const ESCALA_MIN = 30, ESCALA_MAX = 150, ESCALA_PASSO = 10;

  let detalhe = pref('gotech-patio-detalhe', 'completo');

  $('#detalhe').addEventListener('click', () => { detalhe = DETALHES[(DETALHES.indexOf(detalhe) + 1) % DETALHES.length]; gravarPref('gotech-patio-detalhe', detalhe); aplicarDetalhe(); });
  // filtros (so de exibicao): etapas escondidas e mecanico; guardados neste navegador

    const opcoes = ['<option value="">Todos</option>', ...nomes.map(n => `<option value="${esc(n)}">${esc(n)}</option>`), temSem || filtroMecanico === SEM_MECANICO ? `<option value="${SEM_MECANICO}">Sem mecânico</option>` : ''].join('');

  function relogio() { $('#relogio').textContent = hora(new Date(agora())); }

  // ---------- Supabase (REST puro, sem biblioteca) ----------
  const configurada = () => /^https:\/\//.test(SUPABASE) && CHAVE && !CHAVE.startsWith('__');
  async function chamar(metodo, caminho, corpo, token) {
    const cab = { apikey: CHAVE, 'Content-Type': 'application/json' };
    if (token) cab.Authorization = 'Bearer ' + token;
    let r;
    try { r = await fetch(SUPABASE + caminho, { method: metodo, headers: cab, body: corpo === undefined ? undefined : JSON.stringify(corpo), cache: 'no-store' }); }
    catch (e) { const erro = new Error('Sem conexão com a internet agora. Tentando de novo…'); erro.rede = true; throw erro; }
    const texto = await r.text();
    let d = null;
    try { d = texto ? JSON.parse(texto) : null; } catch (e) { d = { message: texto }; }
    if (!r.ok) { const erro = new Error(traduzir(d, r.status)); erro.status = r.status; erro.dados = d; throw erro; }
    return d;
  }
  function traduzir(d, status) {
    const t = JSON.stringify(d || {}).toLowerCase();
    if (t.includes('invalid login') || t.includes('invalid_grant') || t.includes('invalid_credentials')) return 'Login ou senha não conferem.';
    if (t.includes('email not confirmed')) return 'O e-mail desta conta ainda não foi confirmado.';
    if (t.includes('pgrst202') || t.includes('could not find the function')) return 'O painel do pátio ainda não foi ativado no servidor (supabase/patio_web.sql). Avise o escritório.';
    if (t.includes('42501') || t.includes('licenca') || t.includes('licença')) return 'Este login não tem licença válida do Go Tech nesta oficina (ou foi desativado na equipe).';
    if (status === 429) return 'Muitas tentativas: espere um minuto.';
    return (d && (d.message || d.msg || d.error_description || d.error)) || `Erro ${status}`;
  }
  function emailDe(texto) {
    const t = String(texto || '').trim().toLowerCase();

    }
  }

  // ---------- entrar e sair ----------

  // ---------- desenhar ----------
  const ICONE_TEMPO = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
  const ICONE_MECANICO = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>';
  function cartao(o, variosPcs) {
    const t = textosDoCarro(o, agora());

    const novo = st.desenhou && st.vistos.get(o.ref) !== o.alterado_em;  // OS nova ou mudou desde a ultima tela

    return `<article class="carro${novo ? ' novo' : ''}" role="listitem" data-ref="${esc(o.ref)}" data-status="${esc(o.status)}">

      <div class="modelo">${esc(o.modelo || 'Modelo não informado')}</div>
      ${o.cliente ? `<div class="cliente">${esc(o.cliente)}</div>` : ''}
      ${o.etapa && o.etapa !== o.coluna ? `<span class="etapa-chip">${esc(st.nomes[o.etapa] || o.etapa)}</span>` : ''}
      <div class="bancada" data-estado="${esc(t.estado)}" title="${esc(t.dica)}"${t.bancada ? '' : ' hidden'}>${ICONE_MECANICO}<span class="bancada-texto">${esc(t.bancada)}</span></div>

  }
  function desenhar() {
    const d = st.dados;
    if (!d) return;
    $('#oficina').textContent = d.oficina || 'Go Tech';
    const q = montarQuadro(d);
    st.quadro = q;
    st.nomes = Object.fromEntries(q.colunas.map(c => [c.etapa, c.rotulo]));
    st.porRef = new Map(q.colunas.flatMap(c => c.os).map(o => [o.ref, o]));
    pintarFiltros(q);
    const visiveis = q.colunas.filter(c => !etapasOcultas.includes(c.etapa))
      .map(c => { const os = c.os.filter(passaMecanico); return { ...c, os, quantidade: os.length }; });
    $('#n-total').textContent = filtrando() ? `${visiveis.reduce((n, c) => n + c.quantidade, 0)} de ${q.total}` : q.total;
    const variosPcs = new Set(q.colunas.flatMap(c => c.os).map(o => o.pc).filter(Boolean)).size > 1;
    const colunas = visiveis.filter(c => vazias === 'mostrar' || c.quantidade);
    $('#quadro').innerHTML = colunas.map(c => `<section class="coluna" role="listitem" data-etapa="${esc(c.etapa)}" data-cor="${esc(c.cor)}" aria-label="${esc(c.rotulo || c.etapa)}: ${c.quantidade} OS">
      <div class="coluna-topo"><h2>${esc(c.rotulo || c.etapa)}</h2><span class="contador" title="${c.quantidade} OS">${c.quantidade}</span></div>
      <div class="lista" role="list">${c.os.map(o => cartao(o, variosPcs)).join('') || '<p class="coluna-vazia">Nenhuma OS</p>'}</div></section>`).join('')
      || '<div class="vazio">Nenhum carro no pátio agora.</div>';
    const f = $('#finalizadas');
    f.hidden = !q.finalizadas.length;
    f.innerHTML = q.finalizadas.length ? `<strong>Entregues/finalizadas hoje <span id="n-finalizadas">${q.finalizadas.length}</span></strong><ul>${q.finalizadas.map(o => {
      const h = String(o.finalizada_em || '').slice(11, 16);
      return `<li data-ref="${esc(o.ref)}"><b>${esc(o.placa || '—')}</b> ${esc(o.modelo || '')}${h ? ` <time>${esc(h)}</time>` : ''}</li>`;
    }).join('')}</ul>` : '';
    st.vistos = new Map(q.colunas.flatMap(c => c.os).map(o => [o.ref, o.alterado_em])); st.desenhou = st.ultimoOk > 0;
    avisos();
  }
  // os tempos andam sozinhos a cada segundo (so o texto muda: sem redesenhar o quadro nem piscar)
  function tempos() {
    if (!st.porRef) return;
    const ms = agora();
    for (const el of document.querySelectorAll('#quadro .carro')) {
      const o = st.porRef.get(el.dataset.ref);
      if (!o) continue;
      const t = textosDoCarro(o, ms);
      const tt = el.querySelector('.tempo-texto'), bt = el.querySelector('.bancada-texto');
      if (tt && tt.textContent !== t.aberta) { tt.textContent = t.aberta; tt.parentElement.classList.toggle('muito', t.muito); }
      if (bt && bt.textContent !== t.bancada) { bt.textContent = t.bancada; bt.parentElement.hidden = !t.bancada; }
    }
  }
  function avisos() {
    const lista = [];
    if (st.erro) lista.push(`<div class="aviso ruim">${esc(st.erro)}</div>`);
    for (const m of (st.dados && st.dados.pcs) || []) {
      const v = dataLocal(m.visto_em);
      const min = v ? Math.floor((agora() - v.getTime()) / 60000) : null;
      if (min !== null && min >= 15) lista.push(`<div class="aviso">${esc(m.pc)} sem sinal há ${min >= 120 ? `${Math.floor(min / 60)} h` : `${min} min`}: as OS dele podem estar desatualizadas (programa fechado ou sem internet).</div>`);
    }
    const html = lista.join('');
    if ($('#avisos').innerHTML !== html) $('#avisos').innerHTML = html;
  }
  function sinal() {
    const el = $('#sinal');
    if (!st.ultimoOk) { el.textContent = 'conectando…'; el.dataset.estado = 'atrasado'; return; }
    const s = Math.floor((Date.now() - st.ultimoOk) / 1000);
    el.dataset.estado = s > 120 ? 'parado' : s > 30 ? 'atrasado' : '';
    el.textContent = s < 10 ? 'ao vivo' : s < 120 ? `há ${s} s` : `parado há ${Math.floor(s / 60)} min`;
  }
  setInterval(() => { relogio(); if (sessao && st.dados) tempos(); }, 1000); relogio();
  setInterval(() => { if (sessao) { sinal(); avisos(); } }, 15000);

  // ---------- rodada ----------
  async function rodada() {
    if (!sessao || st.rodando) return;
    st.rodando = true;
    try {
      const completo = !st.dados || Date.now() - st.ultimoCompleto > COMPLETO_MS;  // a cada 5 min tudo (o "hoje" vira o dia)
      const d = await painel(completo ? 0 : st.seq);
      if (d && d.agora) { const s = Date.parse(d.agora); if (!Number.isNaN(s)) st.desvio = s - Date.now(); }
      const mudou = d && d.mudou !== false;
      if (mudou) { st.dados = d; st.ultimoCompleto = Date.now(); }
      st.seq = Number((d && d.seq) || 0);
      const vinhaComErro = !!st.erro;
      st.ultimoOk = Date.now(); st.erro = ''; st.erroStatus = 0;
      if (mudou || !st.quadro) desenhar(); else if (vinhaComErro) avisos();
    } catch (e) {
      if (e.sair) { st.erro = e.message; $('#entrada-msg').textContent = e.message; return; }
      st.erro = e.message; st.erroStatus = e.status || 0;
      if (!st.dados) st.dados = { os: [], pcs: [] };
      desenhar();
    } finally {
      st.rodando = false; sinal(); agendar();
    }
  }
  function agendar() {
    clearTimeout(st.timer);
    if (!sessao) return;
    st.timer = setTimeout(rodada, document.hidden ? LENTO_MS : RAPIDO_MS);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && sessao) { manterAcesa(); rodada(); } });

  // ---------- comeco ----------
  if (!configurada()) { mostrar(false); $('#entrada-msg').textContent = 'Esta página ainda não foi publicada com o endereço do servidor.'; return; }
  if (sessao) { mostrar(true); manterAcesa(); rodada(); } else mostrar(false);
})();
</script>
