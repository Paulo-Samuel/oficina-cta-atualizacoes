<!doctype html>
<html lang="pt-BR">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://ysoiqefnkjtessyhwzug.supabase.co; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">

<title>Go Tech · Pátio</title>
<!--
  Painel do pátio no navegador (Go Tech, 04/11/2026; docs/SINCRONIZACAO.md §9). Pedido do Ronan: o menino do
  pátio vê a OS que a recepção abriu, na TV ou num computador qualquer, SEM instalar o programa.
  - Só para ver: nenhum botão muda OS. Lê só a função public.patio_web_painel (supabase/patio_web.sql), que
    devolve placa, modelo, cliente (nome), mecânico, situação, etapa e datas -- nada de CPF/CNPJ nem valores.
  - Entra com o login da equipe (ou o e-mail da conta) e a senha, no Auth do Supabase. Na página vai só a chave
    PÚBLICA (anon); quem protege os dados é o RLS/oficina_da_sessao() no servidor. Nunca uma chave service_role.
  - Atualiza sozinha: a cada 5 s com a página visível (a resposta é minúscula quando nada mudou), 30 s escondida.
  - https://ysoiqefnkjtessyhwzug.supabase.co e sb_publishable_01273TSKNqVnSbDioqcJZA_yxmcH8lR são trocados na publicação (scripts/publicar_patio_web.py).
-->
<style>
  :root { --bg: #eef1f6; --card: #fff; --texto: #1d2533; --apagado: #5a6478; --borda: #d9dfea; --cor: #2457e6; --cor-clara: #e3ebff;
    --ok: #1f7a4d; --ok-claro: #e2f4ea; --alerta: #9a5b00; --alerta-claro: #fff1d6; --ruim: #b8322c; --ruim-claro: #fde8e6;
    --topo: #0e1a33; --placa-fundo: #fff; --placa-borda: #1d2533; --placa-faixa: #2457e6; color-scheme: light; }
  :root[data-tema="escuro"] { --bg: #0a0f1c; --card: #141c2e; --texto: #eef1f7; --apagado: #a8b2c6; --borda: #27314a; --cor: #8fb0ff; --cor-clara: #1b2a52;
    --ok: #8fd6aa; --ok-claro: #193626; --alerta: #ffcb70; --alerta-claro: #3a2c10; --ruim: #f39a90; --ruim-claro: #3d2120;
    --topo: #050913; --placa-fundo: #f3f5f9; --placa-borda: #000; --placa-faixa: #2457e6; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-tema="claro"]) { --bg: #0a0f1c; --card: #141c2e; --texto: #eef1f7; --apagado: #a8b2c6; --borda: #27314a;
    --cor: #8fb0ff; --cor-clara: #1b2a52; --ok: #8fd6aa; --ok-claro: #193626; --alerta: #ffcb70; --alerta-claro: #3a2c10; --ruim: #f39a90;
    --ruim-claro: #3d2120; --topo: #050913; --placa-fundo: #f3f5f9; --placa-borda: #000; color-scheme: dark; } }
  /* escala pela largura: 1080p ~22px, 4K ~40px, celular 15px */
  html { font-size: clamp(15px, 0.95vw + 4px, 42px); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--texto); font: 1rem/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: .8rem; padding: .55rem 1.2rem; background: var(--topo); color: #fff; }
  header h1 { margin: 0; font-size: 1.25rem; letter-spacing: .01em; }
  header .oficina { color: #c9d3e6; font-size: .85rem; }
  header .esp { flex: 1; }
  .relogio { font: 700 1.5rem/1 ui-monospace, Consolas, monospace; }
  .sinal { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; color: #c9d3e6; white-space: nowrap; }
  .sinal::before { content: ""; width: .6rem; height: .6rem; border-radius: 50%; background: #3ccf7d; }
  .sinal[data-estado="atrasado"]::before { background: #ffb020; }
  .sinal[data-estado="parado"]::before { background: #ff5a4f; }
  .icone { border: 1px solid #ffffff40; background: #ffffff14; color: #fff; border-radius: .5rem; padding: .3rem .6rem; font-size: .8rem; cursor: pointer; }
  .icone:hover, .icone:focus-visible { background: #ffffff2a; outline: none; }
  main { padding: 1rem 1.2rem 2rem; }
  .avisos { display: grid; gap: .5rem; margin-bottom: .8rem; }
  .aviso { padding: .5rem .8rem; border-radius: .6rem; font-size: .85rem; background: var(--alerta-claro); color: var(--alerta); }
  .aviso.ruim { background: var(--ruim-claro); color: var(--ruim); }
  section { margin-bottom: 1.2rem; }
  h2 { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .6rem; font-size: 1.1rem; }
  h2 .n { display: inline-grid; place-items: center; min-width: 1.6rem; padding: 0 .4rem; height: 1.6rem; border-radius: .8rem; background: var(--cor); color: #fff; font-size: .85rem; }
  #entrega h2 .n { background: var(--ok); }
  :root[data-tema="escuro"] h2 .n { color: #0a0f1c; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15.5rem), 1fr)); gap: .8rem; }
  .carro { position: relative; display: flex; flex-direction: column; gap: .35rem; padding: .75rem .85rem .7rem; border-radius: .8rem; background: var(--card);
    border: 1px solid var(--borda); border-left: .35rem solid var(--apagado); box-shadow: 0 1px 3px #0000000f; }
  .carro[data-status="em_execucao"] { border-left-color: var(--cor); }
  .carro[data-status="aberta"] { border-left-color: var(--alerta); }
  .carro.pronto { border-left-color: var(--ok); }
  .carro.novo { animation: brilho 2.4s ease-out 1; }
  @keyframes brilho { 0% { box-shadow: 0 0 0 .3rem var(--cor); } 100% { box-shadow: 0 1px 3px #0000000f; } }
  @media (prefers-reduced-motion: reduce) { .carro.novo { animation: none; outline: .2rem solid var(--cor); } }
  .linha1 { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .placa { display: inline-block; padding: .05rem .5rem .1rem; border: .12rem solid var(--placa-borda); border-top-width: .45rem; border-top-color: var(--placa-faixa);
    border-radius: .35rem; background: var(--placa-fundo); color: #111; font: 800 1.45rem/1.1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: .08em; }
  .tempo { font: 700 1.05rem/1 ui-monospace, Consolas, monospace; color: var(--apagado); white-space: nowrap; }
  .tempo.muito { color: var(--ruim); }
  .modelo { font-weight: 700; font-size: 1.02rem; overflow-wrap: anywhere; }
  .cliente { color: var(--apagado); font-size: .88rem; overflow-wrap: anywhere; }
  .mecanico { font-size: .92rem; }
  .mecanico strong { font-weight: 700; }
  .mecanico.sem { color: var(--alerta); font-weight: 600; }
  .rodape { display: flex; flex-wrap: wrap; align-items: center; gap: .35rem; margin-top: .15rem; }
  .chip { display: inline-block; padding: .12rem .5rem; border-radius: 1rem; font-size: .78rem; font-weight: 600; background: var(--cor-clara); color: var(--cor); }
  .chip.aberta { background: var(--alerta-claro); color: var(--alerta); }
  .chip.pronto { background: var(--ok-claro); color: var(--ok); }
  .chip.etapa { background: transparent; border: 1px solid var(--borda); color: var(--texto); }
  .os { margin-left: auto; color: var(--apagado); font-size: .75rem; white-space: nowrap; }
  .vazio { padding: 1rem; border: 1px dashed var(--borda); border-radius: .8rem; color: var(--apagado); text-align: center; }
  /* entrada */
  .entrada { max-width: 26rem; margin: 8vh auto 0; padding: 1.4rem; border-radius: 1rem; background: var(--card); border: 1px solid var(--borda); }
  .entrada h1 { margin: 0 0 .3rem; font-size: 1.3rem; }
  .entrada p { margin: .3rem 0 .8rem; color: var(--apagado); font-size: .9rem; }
  .entrada label { display: block; margin: .7rem 0 0; font-size: .85rem; font-weight: 600; }
  .entrada input[type=text], .entrada input[type=password] { width: 100%; margin-top: .3rem; padding: .6rem .7rem; border: 1px solid var(--borda); border-radius: .55rem; background: var(--card); color: var(--texto); }
  .entrada .check { display: flex; align-items: center; gap: .5rem; font-weight: 500; }
  .entrada button { width: 100%; margin-top: 1rem; padding: .7rem; border: 0; border-radius: .6rem; background: var(--cor); color: #fff; font-weight: 700; cursor: pointer; }
  :root[data-tema="escuro"] .entrada button { color: #0a0f1c; }
  .msg { margin-top: .7rem; font-size: .88rem; color: var(--ruim); min-height: 1.2em; }
  @media (max-width: 640px) { header { flex-wrap: wrap; } .relogio { font-size: 1.2rem; } main { padding: .8rem; } }
</style>
</head>
<body>
<header>
  <div><h1>Pátio</h1><div class="oficina" id="oficina">Go Tech</div></div>
  <span class="esp"></span>
  <span class="sinal" id="sinal" role="status" aria-live="polite" hidden></span>
  <span class="relogio" id="relogio" aria-label="Hora"></span>
  <button class="icone" type="button" id="tema" title="Trocar entre claro, escuro e automático">Tema: auto</button>
  <button class="icone" type="button" id="tela-cheia" title="Tela cheia (para a TV)">Tela cheia</button>
  <button class="icone" type="button" id="sair" hidden>Sair</button>
</header>

<form class="entrada" id="tela-entrada" hidden novalidate>
  <h1>Entrar no painel do pátio</h1>
  <p>Use o login da equipe (o mesmo do programa) ou o e-mail da conta Go Tech. Este painel só mostra os carros: não muda nada.</p>
  <label for="login">Login da equipe ou e-mail</label>
  <input type="text" id="login" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="senha">Senha</label>
  <input type="password" id="senha" autocomplete="current-password" required>
  <label class="check"><input type="checkbox" id="lembrar" checked> Manter conectado neste aparelho</label>
  <button type="submit" id="entrar">Entrar</button>
  <div class="msg" id="entrada-msg" role="alert"></div>
</form>

<main id="tela-patio" hidden>
  <div class="avisos" id="avisos"></div>
  <section id="andamento"><h2>No pátio <span class="n" id="n-andamento">0</span></h2><div class="grade" id="grade-andamento"></div></section>
  <section id="entrega"><h2>Pronto para entrega <span class="n" id="n-entrega">0</span></h2><div class="grade" id="grade-entrega"></div></section>
</main>

<script>
(() => {
  const SUPABASE = 'https://ysoiqefnkjtessyhwzug.supabase.co';
  const CHAVE = 'sb_publishable_01273TSKNqVnSbDioqcJZA_yxmcH8lR';
  const DOMINIO_EQUIPE = 'equipe.gotech.invalid';
  const RAPIDO_MS = 5000, LENTO_MS = 30000, COMPLETO_MS = 5 * 60000;
  const ETAPA_ENTREGA = 'Pronto para entrega';
  const NOMES = { aberta: 'Aberta', em_execucao: 'Em execução', finalizada: 'Finalizada', faturada: 'Faturada' };
  const $ = s => document.querySelector(s);
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CHAVE_SESSAO = 'gotech-patio-sessao';
  const guardar = (v, lembrar) => {
    try {
      localStorage.removeItem(CHAVE_SESSAO); sessionStorage.removeItem(CHAVE_SESSAO);
      if (v) (lembrar ? localStorage : sessionStorage).setItem(CHAVE_SESSAO, JSON.stringify(v));
    } catch (e) { /* modo privado: fica so na memoria */ }
  };
  const lerSessao = () => {
    try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || sessionStorage.getItem(CHAVE_SESSAO) || 'null'); } catch (e) { return null; }
  };
  let sessao = lerSessao();   // {access_token, refresh_token, expira, lembrar}
  const st = { seq: 0, dados: null, ultimoOk: 0, ultimoCompleto: 0, desvio: 0, vistos: new Map(), timer: 0, rodando: false, erro: '' };

  // ---------- tema e tela cheia ----------
  const TEMAS = ['auto', 'claro', 'escuro'];
  function aplicarTema(t) {
    if (t === 'auto') delete document.documentElement.dataset.tema; else document.documentElement.dataset.tema = t;
    $('#tema').textContent = `Tema: ${t}`;
  }
  let tema = (() => { try { return localStorage.getItem('gotech-patio-tema') || 'auto'; } catch (e) { return 'auto'; } })();
  if (!TEMAS.includes(tema)) tema = 'auto';
  aplicarTema(tema);
  $('#tema').addEventListener('click', () => {
    tema = TEMAS[(TEMAS.indexOf(tema) + 1) % TEMAS.length];
    try { localStorage.setItem('gotech-patio-tema', tema); } catch (e) { /* sem armazenamento */ }
    aplicarTema(tema);
  });
  $('#tela-cheia').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen?.(); else document.documentElement.requestFullscreen?.().catch(() => {});
  });
  let trava = null;  // a TV nao apaga a tela (onde o navegador deixa)
  async function manterAcesa() { try { if ('wakeLock' in navigator && !document.hidden) trava = await navigator.wakeLock.request('screen'); } catch (e) { trava = null; } }

  // ---------- relogio ----------
  const agora = () => Date.now() + st.desvio;   // hora do servidor (a TV pode estar com o relogio errado)
  function relogio() { $('#relogio').textContent = new Date(agora()).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
  setInterval(relogio, 1000); relogio();

  // ---------- Supabase (REST puro, sem biblioteca) ----------
  const configurada = () => /^https:\/\//.test(SUPABASE) && CHAVE && !CHAVE.startsWith('__');
  async function chamar(metodo, caminho, corpo, token) {
    const cab = { apikey: CHAVE, 'Content-Type': 'application/json' };
    if (token) cab.Authorization = 'Bearer ' + token;
    let r;
    try { r = await fetch(SUPABASE + caminho, { method: metodo, headers: cab, body: corpo === undefined ? undefined : JSON.stringify(corpo), cache: 'no-store' }); }
    catch (e) { const erro = new Error('Sem conexão com a internet agora. Tentando de novo…'); erro.rede = true; throw erro; }
    const texto = await r.text();
    let d = null;
    try { d = texto ? JSON.parse(texto) : null; } catch (e) { d = { message: texto }; }
    if (!r.ok) { const erro = new Error(traduzir(d, r.status)); erro.status = r.status; erro.dados = d; throw erro; }
    return d;
  }
  function traduzir(d, status) {
    const t = JSON.stringify(d || {}).toLowerCase();
    if (t.includes('invalid login') || t.includes('invalid_grant') || t.includes('invalid_credentials')) return 'Login ou senha não conferem.';
    if (t.includes('email not confirmed')) return 'O e-mail desta conta ainda não foi confirmado.';
    if (t.includes('pgrst202') || t.includes('could not find the function')) return 'O painel do pátio ainda não foi ativado no servidor (supabase/patio_web.sql). Avise o escritório.';
    if (t.includes('42501') || t.includes('licenca') || t.includes('licença')) return 'Este login não tem licença válida do Go Tech nesta oficina (ou foi desativado na equipe).';
    if (status === 429) return 'Muitas tentativas: espere um minuto.';
    return (d && (d.message || d.msg || d.error_description || d.error)) || `Erro ${status}`;
  }
  function emailDe(texto) {
    const t = String(texto || '').trim().toLowerCase();
    if (t.includes('@')) return t;
    const n = t.normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, '.');
    return /^[a-z0-9][a-z0-9._-]{2,29}$/.test(n) ? `${n}@${DOMINIO_EQUIPE}` : null;
  }
  function novaSessao(d, lembrar) {
    sessao = { access_token: d.access_token, refresh_token: d.refresh_token, expira: Math.floor(Date.now() / 1000) + (d.expires_in || 3600), lembrar };
    guardar(sessao, lembrar);
  }
  async function token(forcar) {
    if (!sessao) throw Object.assign(new Error('Entre de novo.'), { sair: true });
    if (!forcar && sessao.expira - 90 > Date.now() / 1000) return sessao.access_token;
    try {
      const d = await chamar('POST', '/auth/v1/token?grant_type=refresh_token', { refresh_token: sessao.refresh_token });
      novaSessao(d, sessao.lembrar);
      return sessao.access_token;
    } catch (e) {
      if (e.status === 400 || e.status === 401 || e.status === 403) { sair(); throw Object.assign(new Error('A sessão venceu: entre de novo.'), { sair: true }); }
      throw e;
    }
  }
  async function painel(seq) {
    try { return await chamar('POST', '/rest/v1/rpc/patio_web_painel', { p_seq: seq }, await token()); }
    catch (e) {
      if (e.status === 401) return chamar('POST', '/rest/v1/rpc/patio_web_painel', { p_seq: seq }, await token(true));  // token vencido no meio
      throw e;
    }
  }

  // ---------- entrar e sair ----------
  function mostrar(logado) {
    $('#tela-entrada').hidden = logado; $('#tela-patio').hidden = !logado; $('#sair').hidden = !logado; $('#sinal').hidden = !logado;
    if (!logado) setTimeout(() => $('#login').focus(), 0);
  }
  function sair() {
    sessao = null; guardar(null);
    clearTimeout(st.timer); st.seq = 0; st.dados = null; st.vistos.clear(); st.desenhou = false; st.ultimoOk = 0; st.erro = '';
    mostrar(false);
  }
  $('#sair').addEventListener('click', () => {
    const t = sessao && sessao.access_token;
    if (t) chamar('POST', '/auth/v1/logout', {}, t).catch(() => {});
    sair();
  });
  $('#tela-entrada').addEventListener('submit', async ev => {
    ev.preventDefault();
    const msg = $('#entrada-msg');
    msg.textContent = '';
    if (!configurada()) { msg.textContent = 'Esta página ainda não foi publicada com o endereço do servidor.'; return; }
    const email = emailDe($('#login').value), senha = $('#senha').value;
    if (!email || !senha) { msg.textContent = 'Preencha o login e a senha.'; return; }
    const botao = $('#entrar'); botao.disabled = true; botao.textContent = 'Entrando…';
    try {
      const d = await chamar('POST', '/auth/v1/token?grant_type=password', { email, password: senha });
      novaSessao(d, $('#lembrar').checked);
      $('#senha').value = '';
      mostrar(true); st.seq = 0;
      await rodada();
      if (!st.ultimoOk && st.erroStatus && st.erroStatus !== 401) { const texto = st.erro; sair(); msg.textContent = texto; }  // sem licenca, servidor sem o SQL
    } catch (e) { msg.textContent = e.message; } finally { botao.disabled = false; botao.textContent = 'Entrar'; }
  });

  // ---------- desenhar ----------
  function dataLocal(iso) {
    if (!iso) return null;
    const d = new Date(String(iso).length <= 16 ? String(iso) + ':00' : String(iso));
    return Number.isNaN(d.getTime()) ? null : d;
  }
  function tempo(iso) {
    const d = dataLocal(iso);
    if (!d) return { texto: '', min: 0 };
    const min = Math.max(0, Math.floor((agora() - d.getTime()) / 60000));
    if (min < 1) return { texto: 'agora', min };
    if (min < 60) return { texto: `${min} min`, min };
    const h = Math.floor(min / 60);
    if (h < 24) return { texto: `${h} h ${String(min % 60).padStart(2, '0')}`, min };
    const dias = Math.floor(h / 24);
    return { texto: dias === 1 ? '1 dia' : `${dias} dias`, min };
  }
  function cartao(o, pronto) {
    const t = tempo(o.data_entrada || o.aberta_em);
    const etapa = o.etapa && o.etapa !== ETAPA_ENTREGA ? `<span class="chip etapa">${esc(o.etapa)}</span>` : '';
    const situacao = pronto ? `<span class="chip pronto">${o.status === 'aberta' || o.status === 'em_execucao' ? 'Pronto para entrega' : `${esc(NOMES[o.status] || o.status)} hoje`}</span>`
      : `<span class="chip ${o.status === 'aberta' ? 'aberta' : ''}">${esc(NOMES[o.status] || o.status)}</span>`;
    const novo = st.desenhou && st.vistos.get(o.ref) !== o.alterado_em;  // OS nova ou mudou desde a ultima tela
    return `<article class="carro${pronto ? ' pronto' : ''}${novo ? ' novo' : ''}" data-ref="${esc(o.ref)}" data-status="${esc(o.status)}">
      <div class="linha1"><span class="placa">${esc(o.placa || '—')}</span><span class="tempo${t.min >= 3 * 24 * 60 ? ' muito' : ''}" title="Desde a entrada">${esc(t.texto)}</span></div>
      <div class="modelo">${esc(o.modelo || 'Modelo não informado')}</div>
      <div class="cliente">${esc(o.cliente || '')}</div>
      <div class="mecanico${o.mecanico ? '' : ' sem'}">${o.mecanico ? `Mecânico: <strong>${esc(o.mecanico)}</strong>` : 'Sem mecânico'}</div>
      <div class="rodape">${situacao}${etapa}<span class="os">OS ${esc(o.numero ?? '')}${o.pc ? ` · ${esc(o.pc)}` : ''}</span></div></article>`;
  }
  function desenhar() {
    const d = st.dados;
    if (!d) return;
    $('#oficina').textContent = d.oficina || 'Go Tech';
    const todas = Array.isArray(d.os) ? d.os : [];
    const pronto = o => o.etapa === ETAPA_ENTREGA || o.status === 'finalizada' || o.status === 'faturada';
    const andamento = todas.filter(o => !pronto(o)), entrega = todas.filter(pronto);
    $('#n-andamento').textContent = andamento.length; $('#n-entrega').textContent = entrega.length;
    $('#grade-andamento').innerHTML = andamento.map(o => cartao(o, false)).join('') || '<div class="vazio">Nenhum carro em andamento agora.</div>';
    $('#grade-entrega').innerHTML = entrega.map(o => cartao(o, true)).join('') || '<div class="vazio">Nenhum carro pronto para entrega.</div>';
    st.vistos = new Map(todas.map(o => [o.ref, o.alterado_em])); st.desenhou = st.ultimoOk > 0;
    avisos();
  }
  function avisos() {
    const lista = [];
    if (st.erro) lista.push(`<div class="aviso ruim">${esc(st.erro)}</div>`);
    for (const m of (st.dados && st.dados.pcs) || []) {
      const v = dataLocal(m.visto_em);
      const min = v ? Math.floor((agora() - v.getTime()) / 60000) : null;
      if (min !== null && min >= 15) lista.push(`<div class="aviso">${esc(m.pc)} sem sinal há ${min >= 120 ? `${Math.floor(min / 60)} h` : `${min} min`}: as OS dele podem estar desatualizadas (programa fechado ou sem internet).</div>`);
    }
    $('#avisos').innerHTML = lista.join('');
  }
  function sinal() {
    const el = $('#sinal');
    if (!st.ultimoOk) { el.textContent = 'conectando…'; el.dataset.estado = 'atrasado'; return; }
    const s = Math.floor((Date.now() - st.ultimoOk) / 1000);
    el.dataset.estado = s > 120 ? 'parado' : s > 30 ? 'atrasado' : '';
    el.textContent = s < 10 ? 'ao vivo' : s < 120 ? `há ${s} s` : `parado há ${Math.floor(s / 60)} min`;
  }
  setInterval(() => { if (sessao) { sinal(); if (st.dados) { desenhar(); } } }, 15000);  // o "tempo" de cada carro anda sozinho

  // ---------- rodada ----------
  async function rodada() {
    if (!sessao || st.rodando) return;
    st.rodando = true;
    try {
      const completo = !st.dados || Date.now() - st.ultimoCompleto > COMPLETO_MS;  // a cada 5 min tudo (o "hoje" vira o dia)
      const d = await painel(completo ? 0 : st.seq);
      if (d && d.agora) { const s = Date.parse(d.agora); if (!Number.isNaN(s)) st.desvio = s - Date.now(); }
      if (d && d.mudou !== false) { st.dados = d; st.ultimoCompleto = Date.now(); }
      st.seq = Number((d && d.seq) || 0);
      st.ultimoOk = Date.now(); st.erro = ''; st.erroStatus = 0;
      desenhar();
    } catch (e) {
      if (e.sair) { st.erro = e.message; $('#entrada-msg').textContent = e.message; return; }
      st.erro = e.message; st.erroStatus = e.status || 0;
      if (!st.dados) st.dados = { os: [], pcs: [] };
      desenhar();
    } finally {
      st.rodando = false; sinal(); agendar();
    }
  }
  function agendar() {
    clearTimeout(st.timer);
    if (!sessao) return;
    st.timer = setTimeout(rodada, document.hidden ? LENTO_MS : RAPIDO_MS);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && sessao) { manterAcesa(); rodada(); } });

  // ---------- comeco ----------
  if (!configurada()) { mostrar(false); $('#entrada-msg').textContent = 'Esta página ainda não foi publicada com o endereço do servidor.'; return; }
  if (sessao) { mostrar(true); manterAcesa(); rodada(); } else mostrar(false);
})();
</script>
